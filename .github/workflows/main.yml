name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest

    # GitHub-hosted runner'larda pratik üst sınır runner limitine bağlıdır.
    # 360 dakika = 6 saat.
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. ENABLE RDP
      # ============================================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Write-Host "=== Configuring Remote Desktop ==="

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Disable Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0 `
            -Force

          # Use standard RDP security layer
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 0 `
            -Force

          # Remove previous firewall rule
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          # Allow TCP 3389
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Restart RDP service
          Restart-Service -Name TermService -Force

          Write-Host "RDP configuration completed."

      # ============================================================
      # 2. CREATE USER
      # ============================================================
      - name: Create RDP User
        shell: powershell
        run: |
          Write-Host "=== Creating RDP User ==="

          # Remove user if it already exists
          $existingUser = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($existingUser) {
              Write-Host "Existing RDP user found. Removing..."
              Remove-LocalUser -Name "RDP"
          }

          # Character sets
          $upper   = [char[]](65..90)
          $lower   = [char[]](97..122)
          $numbers = [char[]](48..57)

          $special = @(
              [char[]](33..47)
              [char[]](58..64)
              [char[]](91..96)
              [char[]](123..126)
          )

          $special = $special | ForEach-Object { $_ }

          # Generate password
          $passwordChars = @()

          $passwordChars += $upper   | Get-Random -Count 4
          $passwordChars += $lower   | Get-Random -Count 4
          $passwordChars += $numbers | Get-Random -Count 4
          $passwordChars += $special | Get-Random -Count 4

          $password = -join ($passwordChars | Sort-Object { Get-Random })

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Create account
          New-LocalUser `
            -Name "RDP" `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires:$true

          # Add administrator permissions
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          # Add Remote Desktop permissions
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          # Verify
          $user = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if (-not $user) {
              Write-Error "Failed to create RDP user."
              exit 1
          }

          # Store credentials for following steps
          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "RDP user created successfully."

      # ============================================================
      # 3. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "=== Installing Tailscale ==="

          # Current stable Windows AMD64 MSI
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.98.10-amd64.msi"

          # Safe Windows temporary path
          $installerPath = Join-Path $env:TEMP "tailscale.msi"

          Write-Host "Download URL:"
          Write-Host $tsUrl

          Write-Host "Installer path:"
          Write-Host $installerPath

          # Download MSI
          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath `
            -UseBasicParsing

          if (-not (Test-Path $installerPath)) {
              Write-Error "Tailscale MSI was not downloaded."
              exit 1
          }

          Write-Host "Tailscale MSI downloaded."

          # Install silently
          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i"
              "`"$installerPath`""
              "/qn"
              "/norestart"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error "Tailscale installation failed. MSI exit code: $($process.ExitCode)"
              exit 1
          }

          Write-Host "Tailscale installation completed."

          # Remove installer
          Remove-Item `
            -Path $installerPath `
            -Force `
            -ErrorAction SilentlyContinue

      # ============================================================
      # 4. FIND TAILSCALE.EXE
      # ============================================================
      - name: Locate Tailscale
        shell: powershell
        run: |
          Write-Host "=== Locating Tailscale CLI ==="

          $possiblePaths = @(
              (Join-Path ${env:ProgramFiles} "Tailscale\tailscale.exe"),
              (Join-Path ${env:ProgramFiles(x86)} "Tailscale\tailscale.exe"),
              (Join-Path $env:ProgramData "Tailscale\tailscale.exe")
          )

          $tailscaleExe = $null

          foreach ($path in $possiblePaths) {
              if ($path -and (Test-Path $path)) {
                  $tailscaleExe = $path
                  break
              }
          }

          # Fallback search
          if (-not $tailscaleExe) {
              $found = Get-ChildItem `
                -Path ${env:ProgramFiles},${env:ProgramFiles(x86)},${env:ProgramData} `
                -Filter "tailscale.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                  $tailscaleExe = $found.FullName
              }
          }

          if (-not $tailscaleExe) {
              Write-Error "tailscale.exe could not be found."
              exit 1
          }

          Write-Host "Tailscale executable:"
          Write-Host $tailscaleExe

          "TAILSCALE_EXE=$tailscaleExe" >> $env:GITHUB_ENV

      # ============================================================
      # 5. CONNECT TAILSCALE
      # ============================================================
      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "=== Connecting to Tailscale ==="

          if (-not $env:TAILSCALE_AUTH_KEY) {
              Write-Error "TAILSCALE_AUTH_KEY secret is missing."
              exit 1
          }

          if (-not (Test-Path $env:TAILSCALE_EXE)) {
              Write-Error "Tailscale executable does not exist."
              exit 1
          }

          # Unique hostname
          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          Write-Host "Hostname: $hostname"

          # Connect
          & $env:TAILSCALE_EXE up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="$hostname"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Write-Host "Tailscale connected."

          # Wait for IPv4
          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

              Write-Host "Waiting for Tailscale IP... attempt $i/20"

              $candidate = & $env:TAILSCALE_EXE ip -4 2>$null

              if ($candidate) {
                  $candidate = ($candidate | Select-Object -First 1).Trim()

                  if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {
                      $tsIP = $candidate
                      break
                  }
              }

              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IPv4 address was not assigned."
              exit 1
          }

          Write-Host "Tailscale IPv4: $tsIP"

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      # ============================================================
      # 6. VERIFY RDP
      # ============================================================
      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "=== Testing RDP ==="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          if (-not $env:TAILSCALE_IP) {
              Write-Error "TAILSCALE_IP is empty."
              exit 1
          }

          # Ensure firewall rule exists
          netsh advfirewall firewall show rule name="RDP-Tailscale"

          # Check RDP service
          $rdpService = Get-Service -Name TermService

          Write-Host "TermService status: $($rdpService.Status)"

          if ($rdpService.Status -ne "Running") {
              Start-Service -Name TermService
              Start-Sleep -Seconds 3
          }

          # TCP test
          $test = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
              Write-Error "TCP 3389 connection failed."
              exit 1
          }

          Write-Host "RDP TCP connectivity successful."

      # ============================================================
      # 7. SHOW CONNECTION INFORMATION
      # ============================================================
      - name: Show RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================="
          Write-Host "             RDP ACCESS"
          Write-Host "============================================="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Port    : 3389"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "============================================="
          Write-Host ""

          # Also add to the GitHub Actions job summary
          @"
          ## RDP ACCESS

          **Address:** `$env:TAILSCALE_IP`:3389

          **Username:** `$env:RDP_USERNAME`

          **Password:** `$env:RDP_PASSWORD`
          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append `
            -Encoding utf8

      # ============================================================
      # 8. KEEP RUNNER ALIVE
      # ============================================================
      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "RDP is active."
          Write-Host "The workflow will remain active until the runner limit is reached or the job is cancelled."
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active"
              Start-Sleep -Seconds 60
          }
