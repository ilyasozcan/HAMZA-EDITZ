name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CONFIGURE WINDOWS RDP
      # ============================================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Write-Host "============================================="
          Write-Host "        CONFIGURING WINDOWS RDP"
          Write-Host "============================================="

          # --------------------------------------------------------
          # Enable Remote Desktop
          # --------------------------------------------------------

          $tsPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $rdpPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'

          Set-ItemProperty `
            -Path $tsPath `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Also set policy-level RDP enable
          New-Item `
            -Path $policyPath `
            -Force |
            Out-Null

          New-ItemProperty `
            -Path $policyPath `
            -Name 'fDenyTSConnections' `
            -PropertyType DWord `
            -Value 0 `
            -Force |
            Out-Null

          # --------------------------------------------------------
          # RDP TCP port = 3389
          # --------------------------------------------------------

          Set-ItemProperty `
            -Path $rdpPath `
            -Name 'PortNumber' `
            -Value 3389 `
            -Force

          # --------------------------------------------------------
          # Disable NLA
          # --------------------------------------------------------

          Set-ItemProperty `
            -Path $rdpPath `
            -Name 'UserAuthentication' `
            -Value 0 `
            -Force

          # --------------------------------------------------------
          # Security layer
          # --------------------------------------------------------

          Set-ItemProperty `
            -Path $rdpPath `
            -Name 'SecurityLayer' `
            -Value 0 `
            -Force

          # --------------------------------------------------------
          # Clipboard redirection
          # --------------------------------------------------------

          New-ItemProperty `
            -Path $policyPath `
            -Name 'fDisableClip' `
            -PropertyType DWord `
            -Value 0 `
            -Force |
            Out-Null

          New-ItemProperty `
            -Path $rdpPath `
            -Name 'fDisableClip' `
            -PropertyType DWord `
            -Value 0 `
            -Force |
            Out-Null

          Write-Host "Clipboard redirection enabled."

          # --------------------------------------------------------
          # Configure TermService
          # --------------------------------------------------------

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          # --------------------------------------------------------
          # Enable Windows built-in RDP firewall group
          # --------------------------------------------------------

          netsh advfirewall firewall set rule `
            group="remote desktop" `
            new enable=Yes

          # --------------------------------------------------------
          # Explicit RDP rule
          # --------------------------------------------------------

          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -Profile Any

          # --------------------------------------------------------
          # Restart TermService
          # --------------------------------------------------------

          Write-Host "Restarting TermService..."

          Restart-Service `
            -Name TermService `
            -Force

          Start-Sleep -Seconds 10

          # --------------------------------------------------------
          # Service verification
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== TERMSERVICE ==="

          $service = Get-Service `
            -Name TermService

          Write-Host "Status    : $($service.Status)"
          Write-Host "StartType : $($service.StartType)"

          if ($service.Status -ne "Running") {
              Start-Service `
                -Name TermService

              Start-Sleep -Seconds 5
          }

          # --------------------------------------------------------
          # Registry verification
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== RDP REGISTRY ==="

          $check = Get-ItemProperty `
            -Path $rdpPath

          Write-Host "fDenyTSConnections : $((Get-ItemProperty $tsPath).fDenyTSConnections)"
          Write-Host "PortNumber         : $($check.PortNumber)"
          Write-Host "UserAuthentication : $($check.UserAuthentication)"
          Write-Host "SecurityLayer      : $($check.SecurityLayer)"
          Write-Host "fDisableClip       : $($check.fDisableClip)"

          # --------------------------------------------------------
          # Give Windows time to create listener
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Waiting for RDP listener..."

          $listenerFound = $false

          for ($i = 1; $i -le 30; $i++) {

              $listener = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($listener) {
                  $listenerFound = $true
                  break
              }

              Write-Host "Waiting... $i/30"
              Start-Sleep -Seconds 2
          }

          # --------------------------------------------------------
          # Listener verification
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== RDP LISTENER ==="

          if (-not $listenerFound) {

              Write-Host ""
              Write-Host "RDP listener was NOT detected."
              Write-Host ""
              Write-Host "=== NETSTAT ==="

              netstat -ano |
                Select-String ":3389"

              Write-Host ""
              Write-Host "=== LISTENING PORTS ==="

              Get-NetTCPConnection `
                -State Listen `
                -ErrorAction SilentlyContinue |
                Sort-Object LocalPort |
                Format-Table -AutoSize

              Write-Error `
                "Windows RDP did not start listening on port 3389."

              exit 1
          }

          $listener |
            Format-Table `
              LocalAddress,
              LocalPort,
              State,
              OwningProcess `
              -AutoSize

          Write-Host ""
          Write-Host "RDP listener is ACTIVE."

          # --------------------------------------------------------
          # Local test
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== LOCAL 3389 TEST ==="

          $localTest = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389 `
            -WarningAction SilentlyContinue

          $localTest |
            Format-List `
              ComputerName,
              RemotePort,
              TcpTestSucceeded

          if (-not $localTest.TcpTestSucceeded) {
              Write-Error "Local TCP 3389 test failed."
              exit 1
          }

          Write-Host ""
          Write-Host "LOCAL RDP TEST PASSED."

      # ============================================================
      # 2. CREATE RDP USER
      # ============================================================
      - name: Create RDP User
        shell: powershell
        run: |
          Write-Host "============================================="
          Write-Host "             CREATING RDP USER"
          Write-Host "============================================="

          $username = "RDP"
          $password = "1234Abcd!"

          # --------------------------------------------------------
          # Remove existing user
          # --------------------------------------------------------

          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existingUser) {

              Write-Host "Removing existing RDP user..."

              Remove-LocalUser `
                -Name $username

              Start-Sleep -Seconds 2
          }

          # --------------------------------------------------------
          # Create password
          # --------------------------------------------------------

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # --------------------------------------------------------
          # Create user
          # --------------------------------------------------------

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -Description "GitHub Actions RDP User" `
            -AccountNeverExpires `
            -PasswordNeverExpires:$true `
            -UserMayNotChangePassword:$true

          # --------------------------------------------------------
          # Administrators
          # --------------------------------------------------------

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Remote Desktop Users
          # --------------------------------------------------------

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Enable user
          # --------------------------------------------------------

          Enable-LocalUser `
            -Name $username

          # --------------------------------------------------------
          # Verify
          # --------------------------------------------------------

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if (-not $user) {
              Write-Error "RDP user was not created."
              exit 1
          }

          Write-Host ""
          Write-Host "RDP user created successfully."

          # Environment variables
          "RDP_USERNAME=.\RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "Username: .\RDP"
          Write-Host "Password: $password"

      # ============================================================
      # 3. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "============================================="
          Write-Host "             INSTALLING TAILSCALE"
          Write-Host "============================================="

          # Current stable Windows AMD64 package
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.98.10-amd64.msi"

          $installerPath = `
            Join-Path $env:TEMP "tailscale.msi"

          Write-Host "Downloading:"
          Write-Host $tsUrl

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath `
            -UseBasicParsing

          if (-not (Test-Path $installerPath)) {
              Write-Error "Tailscale installer download failed."
              exit 1
          }

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i"
              "`"$installerPath`""
              "/qn"
              "/norestart"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {

              Write-Error `
                "Tailscale installation failed. Exit code: $($process.ExitCode)"

              exit 1
          }

          Write-Host "Tailscale installed."

          Remove-Item `
            -Path $installerPath `
            -Force `
            -ErrorAction SilentlyContinue

      # ============================================================
      # 4. LOCATE TAILSCALE
      # ============================================================
      - name: Locate Tailscale
        shell: powershell
        run: |
          Write-Host "============================================="
          Write-Host "              LOCATING TAILSCALE"
          Write-Host "============================================="

          $possiblePaths = @(
            (Join-Path ${env:ProgramFiles} "Tailscale\tailscale.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Tailscale\tailscale.exe"),
            (Join-Path $env:ProgramData "Tailscale\tailscale.exe")
          )

          $tailscaleExe = $null

          foreach ($path in $possiblePaths) {

              if ($path -and (Test-Path $path)) {
                  $tailscaleExe = $path
                  break
              }
          }

          if (-not $tailscaleExe) {

              $searchRoots = @(
                ${env:ProgramFiles},
                ${env:ProgramFiles(x86)},
                ${env:ProgramData}
              ) |
              Where-Object {
                $_ -and (Test-Path $_)
              }

              $found = Get-ChildItem `
                -Path $searchRoots `
                -Filter "tailscale.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                  $tailscaleExe = $found.FullName
              }
          }

          if (-not $tailscaleExe) {
              Write-Error "tailscale.exe could not be found."
              exit 1
          }

          Write-Host "Tailscale executable:"
          Write-Host $tailscaleExe

          "TAILSCALE_EXE=$tailscaleExe" >> $env:GITHUB_ENV

      # ============================================================
      # 5. CONNECT TAILSCALE
      # ============================================================
      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "============================================="
          Write-Host "           CONNECTING TAILSCALE"
          Write-Host "============================================="

          if (-not $env:TAILSCALE_AUTH_KEY) {
              Write-Error "TAILSCALE_AUTH_KEY is missing."
              exit 1
          }

          if (-not (Test-Path $env:TAILSCALE_EXE)) {
              Write-Error "Tailscale executable does not exist."
              exit 1
          }

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          Write-Host "Hostname: $hostname"

          # Auth key MUST be an auth key, not an API key.
          & $env:TAILSCALE_EXE up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="$hostname" `
            --unattended=true

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Write-Host "Tailscale connected."

          # --------------------------------------------------------
          # Wait for IP
          # --------------------------------------------------------

          $tsIP = $null

          for ($i = 1; $i -le 30; $i++) {

              Write-Host "Waiting for Tailscale IPv4... $i/30"

              $candidate = & `
                $env:TAILSCALE_EXE `
                ip -4 2>$null

              if ($candidate) {

                  $candidate = `
                    ($candidate |
                     Select-Object -First 1).Trim()

                  if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {

                      $tsIP = $candidate
                      break
                  }
              }

              Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IPv4 address was not assigned."
              exit 1
          }

          Write-Host ""
          Write-Host "Tailscale IPv4: $tsIP"

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=== TAILSCALE STATUS ==="

          & $env:TAILSCALE_EXE status

          Write-Host ""
          Write-Host "=== TAILSCALE IP ==="

          & $env:TAILSCALE_EXE ip -4

      # ============================================================
      # 6. CLIPBOARD
      # ============================================================
      - name: Prepare RDP Clipboard
        shell: powershell
        run: |
          Write-Host "============================================="
          Write-Host "         CONFIGURING RDP CLIPBOARD"
          Write-Host "============================================="

          $policyPath = `
            'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'

          $rdpPath = `
            'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          # Allow clipboard
          Set-ItemProperty `
            -Path $policyPath `
            -Name 'fDisableClip' `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path $rdpPath `
            -Name 'fDisableClip' `
            -Type DWord `
            -Value 0

          Write-Host "Clipboard redirection enabled."

          # Start rdpclip for current session
          $rdpClip = `
            "$env:WINDIR\System32\rdpclip.exe"

          if (Test-Path $rdpClip) {

              Get-Process `
                -Name "rdpclip" `
                -ErrorAction SilentlyContinue |
                Stop-Process `
                  -Force `
                  -ErrorAction SilentlyContinue

              Start-Process `
                -FilePath $rdpClip

              Write-Host "rdpclip.exe started."
          }

      # ============================================================
      # 7. FINAL RDP CHECK
      # ============================================================
      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "============================================="
          Write-Host "              FINAL RDP TEST"
          Write-Host "============================================="

          Write-Host ""
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          # --------------------------------------------------------
          # Service
          # --------------------------------------------------------

          $service = Get-Service `
            -Name TermService

          if ($service.Status -ne "Running") {

              Start-Service `
                -Name TermService

              Start-Sleep -Seconds 5
          }

          Write-Host ""
          Write-Host "TermService: $((Get-Service TermService).Status)"

          # --------------------------------------------------------
          # Listener
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== 3389 LISTENER ==="

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {

              Write-Host "No listener found."
              Write-Host ""
              Write-Host "=== NETSTAT ==="

              netstat -ano |
                Select-String ":3389"

              Write-Error `
                "RDP is not listening on TCP 3389."

              exit 1
          }

          $listener |
            Format-Table `
              LocalAddress,
              LocalPort,
              State,
              OwningProcess `
              -AutoSize

          # --------------------------------------------------------
          # Local test
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== LOCAL TEST ==="

          $localTest = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389 `
            -WarningAction SilentlyContinue

          $localTest |
            Format-List `
              ComputerName,
              RemotePort,
              TcpTestSucceeded

          if (-not $localTest.TcpTestSucceeded) {

              Write-Error `
                "Local TCP 3389 test failed."

              exit 1
          }

          # --------------------------------------------------------
          # Firewall
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== FIREWALL ==="

          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue |
            Format-Table `
              DisplayName,
              Enabled,
              Direction,
              Action `
              -AutoSize

          Write-Host ""
          Write-Host "============================================="
          Write-Host "          RDP LISTENER IS READY"
          Write-Host "============================================="

      # ============================================================
      # 8. SHOW CONNECTION INFORMATION
      # ============================================================
      - name: Show RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================="
          Write-Host "                 RDP ACCESS"
          Write-Host "============================================="
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Port    : 3389"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "Clipboard: ENABLED"
          Write-Host ""
          Write-Host "============================================="

          @"
          ## RDP ACCESS

          **Address:** $env:TAILSCALE_IP`:3389

          **Username:** $env:RDP_USERNAME

          **Password:** $env:RDP_PASSWORD

          **Clipboard:** Enabled
          "@ |
          Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append `
            -Encoding utf8

      # ============================================================
      # 9. KEEP RUNNER ALIVE
      # ============================================================
      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================="
          Write-Host "                RDP ACTIVE"
          Write-Host "============================================="
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : $env:RDP_USERNAME"
          Write-Host "Port         : 3389"
          Write-Host "Clipboard    : ENABLED"
          Write-Host ""

          while ($true) {

              Write-Host `
                "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active"

              Start-Sleep `
                -Seconds 60
          }
