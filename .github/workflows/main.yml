name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. ENABLE RDP
      # ============================================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Write-Host "=== Configuring Remote Desktop ==="

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Disable Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0 `
            -Force

          # Standard RDP security layer
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 0 `
            -Force

          # ========================================================
          # CLIPBOARD / COPY-PASTE
          # ========================================================

          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'

          New-Item `
            -Path $policyPath `
            -Force | Out-Null

          # Clipboard redirection allowed
          New-ItemProperty `
            -Path $policyPath `
            -Name 'fDisableClip' `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          # RDP-Tcp clipboard allowed
          New-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'fDisableClip' `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          Write-Host "Clipboard redirection enabled."

          # ========================================================
          # FIREWALL
          # ========================================================

          netsh advfirewall firewall delete rule `
            name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Restart RDP service
          Restart-Service -Name TermService -Force

          Write-Host "RDP configuration completed."

      # ============================================================
      # 2. CREATE RDP USER
      # ============================================================
          # ============================================================
      # 2. CREATE RDP USER
      # ============================================================
      - name: Create RDP User
        shell: powershell
        run: |
          Write-Host "=== Creating RDP User ==="

          $username = "RDP"
          $password = "1234Abcd!"

          # Remove existing RDP user
          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
              Write-Host "Existing RDP account found. Removing..."
              Remove-LocalUser -Name $username
          }

          # Convert password
          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Create user
          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -Description "GitHub Actions RDP User" `
            -AccountNeverExpires `
            -PasswordNeverExpires:$true `
            -UserMayNotChangePassword:$true

          # Add to Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          # Add to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          # Enable account
          Enable-LocalUser -Name $username

          # Verify
          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if (-not $user) {
              Write-Error "Failed to create RDP user."
              exit 1
          }

          Write-Host "RDP user created successfully."

          # Save credentials
          "RDP_USERNAME=.\RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "Username: .\RDP"
          Write-Host "Password: $password"

      # ============================================================
      # 3. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "=== Installing Tailscale ==="

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.98.10-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale.msi"

          Write-Host "Download URL:"
          Write-Host $tsUrl

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath `
            -UseBasicParsing

          if (-not (Test-Path $installerPath)) {
              Write-Error "Tailscale MSI was not downloaded."
              exit 1
          }

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i"
              "`"$installerPath`""
              "/qn"
              "/norestart"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error `
                "Tailscale installation failed. MSI exit code: $($process.ExitCode)"
              exit 1
          }

          Write-Host "Tailscale installation completed."

          Remove-Item `
            -Path $installerPath `
            -Force `
            -ErrorAction SilentlyContinue

      # ============================================================
      # 4. FIND TAILSCALE.EXE
      # ============================================================
      - name: Locate Tailscale
        shell: powershell
        run: |
          Write-Host "=== Locating Tailscale CLI ==="

          $possiblePaths = @(
            (Join-Path ${env:ProgramFiles} "Tailscale\tailscale.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Tailscale\tailscale.exe"),
            (Join-Path $env:ProgramData "Tailscale\tailscale.exe")
          )

          $tailscaleExe = $null

          foreach ($path in $possiblePaths) {
              if ($path -and (Test-Path $path)) {
                  $tailscaleExe = $path
                  break
              }
          }

          # Fallback search
          if (-not $tailscaleExe) {
              $searchRoots = @(
                ${env:ProgramFiles},
                ${env:ProgramFiles(x86)},
                ${env:ProgramData}
              ) | Where-Object {
                $_ -and (Test-Path $_)
              }

              $found = Get-ChildItem `
                -Path $searchRoots `
                -Filter "tailscale.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                  $tailscaleExe = $found.FullName
              }
          }

          if (-not $tailscaleExe) {
              Write-Error "tailscale.exe could not be found."
              exit 1
          }

          Write-Host "Tailscale executable:"
          Write-Host $tailscaleExe

          "TAILSCALE_EXE=$tailscaleExe" >> $env:GITHUB_ENV

      # ============================================================
      # 5. CONNECT TAILSCALE
      # ============================================================
      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "=== Connecting to Tailscale ==="

          if (-not $env:TAILSCALE_AUTH_KEY) {
              Write-Error "TAILSCALE_AUTH_KEY secret is missing."
              exit 1
          }

          if (-not (Test-Path $env:TAILSCALE_EXE)) {
              Write-Error "Tailscale executable does not exist."
              exit 1
          }

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          Write-Host "Hostname: $hostname"

          & $env:TAILSCALE_EXE up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="$hostname"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Write-Host "Tailscale connected."

          # Wait for IPv4
          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

              Write-Host `
                "Waiting for Tailscale IP... attempt $i/20"

              $candidate = & $env:TAILSCALE_EXE ip -4 2>$null

              if ($candidate) {
                  $candidate = `
                    ($candidate | Select-Object -First 1).Trim()

                  if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {
                      $tsIP = $candidate
                      break
                  }
              }

              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IPv4 address was not assigned."
              exit 1
          }

          Write-Host "Tailscale IPv4: $tsIP"

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      # ============================================================
      # 6. PREPARE CLIPBOARD
      # ============================================================
      - name: Prepare RDP Clipboard
        shell: powershell
        run: |
          Write-Host "=== Preparing RDP Clipboard ==="

          # Re-apply clipboard policy
          $policyPath = `
            'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'

          New-Item `
            -Path $policyPath `
            -Force | Out-Null

          Set-ItemProperty `
            -Path $policyPath `
            -Name 'fDisableClip' `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path `
            'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'fDisableClip' `
            -Type DWord `
            -Value 0

          # Start clipboard process for the runner session
          $rdpClip = "$env:WINDIR\System32\rdpclip.exe"

          if (Test-Path $rdpClip) {
              Get-Process `
                -Name "rdpclip" `
                -ErrorAction SilentlyContinue |
                Stop-Process `
                  -Force `
                  -ErrorAction SilentlyContinue

              Start-Process $rdpClip

              Write-Host "rdpclip.exe started."
          }
          else {
              Write-Host "rdpclip.exe not found."
          }

          Write-Host "Clipboard configuration completed."

      # ============================================================
      # 7. VERIFY RDP
      # ============================================================
      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "=== Testing RDP ==="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          if (-not $env:TAILSCALE_IP) {
              Write-Error "TAILSCALE_IP is empty."
              exit 1
          }

          # Firewall
          Write-Host "Checking firewall rule..."
          netsh advfirewall firewall show rule `
            name="RDP-Tailscale"

          # RDP service
          $rdpService = Get-Service `
            -Name TermService

          Write-Host `
            "TermService status: $($rdpService.Status)"

          if ($rdpService.Status -ne "Running") {
              Start-Service `
                -Name TermService

              Start-Sleep -Seconds 3
          }

          # TCP 3389
          $test = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
              Write-Error "TCP 3389 connection failed."
              exit 1
          }

          Write-Host "RDP TCP connectivity successful."

      # ============================================================
      # 8. SHOW CONNECTION INFORMATION
      # ============================================================
      - name: Show RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================="
          Write-Host "              RDP ACCESS"
          Write-Host "============================================="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Port    : 3389"
          Write-Host "User    : $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "Clipboard: ENABLED"
          Write-Host "============================================="
          Write-Host ""

          @"
          ## RDP ACCESS

          **Address:** `$env:TAILSCALE_IP:3389`

          **Username:** `$env:RDP_USERNAME`

          **Password:** `$env:RDP_PASSWORD`

          **Clipboard:** Enabled
          "@ |
          Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append `
            -Encoding utf8

      # ============================================================
      # 9. KEEP RUNNER ALIVE
      # ============================================================
      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "RDP is active."
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host ""

          while ($true) {

              Write-Host `
                "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active"

              Start-Sleep -Seconds 60
          }
